name: PrathamX Video Optimizer

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "test = check only | apply = badlo | recover = purane version se wapas"
        type: choice
        options: [test, apply, recover]
        default: test
      only:
        description: "Sirf in naam wale (comma se alag). recover me ZAROORI"
        required: false
      limit:
        description: "Kitne videos (test me khali = 1)"
        required: false

concurrency:
  group: prx-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg + libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Optimize videos
        env:
          PRX_SA_JSON: ${{ secrets.PRX_SA_JSON }}
          PRX_FOLDER_ID: ${{ secrets.PRX_FOLDER_ID }}
          PRX_EXCLUDE: Feature plan,CA motivation
          PRX_MODE: ${{ inputs.mode || 'apply' }}
          PRX_ONLY: ${{ inputs.only }}
          PRX_LIMIT: ${{ inputs.limit }}
        run: python prx_optimize_ci.py
